# Clash Verge Rev - Merge Profile 示例
# 位置：Clash Verge → Profiles → 对应订阅的 Merge 配置
# 实际文件：~/Library/Application Support/io.github.clash-verge-rev.clash-verge-rev/profiles/<uid>.yaml
#
# 本文件为脱敏版本，与 2026-08-08 现役双完整链容灾配置同步。
# IP/端口/用户名/密码均为占位符。
#
# 注意：现役另挂了一个 script（内容与本 merge 的 Codex-Stable 完全重复）。
# merge+script 组合会触发 Verge 的 prepend 不展开 bug（靠 heal 每轮兜底）。
# 新部署（含 Windows 迁移）一律只用 merge、不配 script。

tcp-concurrent: true
unified-delay: true

prepend-proxies:
  # 每个节点都是可独立健康检查的完整链：第一跳 → 静态住宅 SOCKS → Anthropic。
  # 2026-08-08 资格测试仅 JP3-HY2、JP1-HY2 达到连续 20/20；JP3 固定第一成员。
  - { name: 'Claude-Residential-JP3', type: socks5, server: <YOUR_SOCKS5_IP>, port: <PORT>, username: <USERNAME>, password: <PASSWORD>, udp: true, dialer-proxy: JP3-HY2 }
  - { name: 'Claude-Residential-JP1', type: socks5, server: <YOUR_SOCKS5_IP>, port: <PORT>, username: <USERNAME>, password: <PASSWORD>, udp: true, dialer-proxy: JP1-HY2 }

prepend-proxy-groups:
  - name: Claude-Residential
    type: fallback
    proxies:
      - Claude-Residential-JP3
      - Claude-Residential-JP1
    url: https://api.anthropic.com/
    interval: 15
    lazy: false
    max-failed-times: 2
    expected-status: 404
  - name: Claude
    type: select
    proxies:
      - Claude-Residential
      - REJECT
  - name: Codex-Stable
    type: fallback
    proxies:
      - SG5-HY2
      - SG4-HY2
      - JP2-HY2
      - JP4-HY2
      - JP3-HY2
      - TW-2
      - TW-4
      - TW-7
      - OpenAI
    url: 'https://chatgpt.com/cdn-cgi/trace'
    interval: 300
    lazy: true
    max-failed-times: 3

prepend-rules:
  # 家宽 socks5 服务器本身直连，防回环
  - 'IP-CIDR,<YOUR_SOCKS5_IP>/32,DIRECT,no-resolve'

  # === IP 探测域名走 Claude（用于校验出口）===
  - 'DOMAIN,ifconfig.me,Claude'
  - 'DOMAIN,api.ipify.org,Claude'
  - 'DOMAIN,ipv4.icanhazip.com,Claude'
  - 'DOMAIN-SUFFIX,ip.sb,Claude'
  - 'DOMAIN-SUFFIX,ping0.cc,Claude'

  # === 进程级兜底（依赖 TUN；macOS=claude / curl，Windows=claude.exe / curl.exe）===
  - 'PROCESS-NAME,curl,Claude'
  - 'PROCESS-NAME,claude.exe,Claude'
  - 'PROCESS-NAME,claude,Claude'

  # === Claude 全家桶钉死到家宽出口 ===
  - 'DOMAIN-SUFFIX,anthropic.com,Claude'
  - 'DOMAIN-SUFFIX,claude.ai,Claude'
  - 'DOMAIN-SUFFIX,claude.com,Claude'
  - 'DOMAIN-SUFFIX,clau.de,Claude'
  - 'DOMAIN-SUFFIX,claudeusercontent.com,Claude'
  - 'DOMAIN-SUFFIX,modelcontextprotocol.io,Claude'
  - 'DOMAIN,anthropic.statuspage.io,Claude'
  - 'IP-CIDR,160.79.104.0/21,Claude,no-resolve'
  - 'IP-CIDR6,2607:6bc0::/48,Claude,no-resolve'

  # === OpenAI / Codex 走稳定节点 ===
  - 'DOMAIN-SUFFIX,chatgpt.com,Codex-Stable'
  - 'DOMAIN-SUFFIX,openai.com,Codex-Stable'
  - 'DOMAIN-SUFFIX,oaistatic.com,Codex-Stable'
  - 'DOMAIN-SUFFIX,oaiusercontent.com,Codex-Stable'
