prepend-proxies:
  - name: Claude-Residential
    type: socks5
    server: 192.0.2.10
    port: 443
    username: fixture-user
    password: fixture-password
    udp: true
    dialer-proxy: Claude-Tunnel

prepend-proxy-groups:
  - name: Claude-Tunnel
    type: fallback
    proxies:
      - SG4-HY2
      - JP3-HY2
    url: http://cp.cloudflare.com/generate_204
  - name: Claude
    type: select
    proxies:
      - Claude-Residential

